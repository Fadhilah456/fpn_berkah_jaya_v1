name: fpn_berkah_abadi
description: FPN BERKAH ABADI v4.0.0 Flutter App for Android & iware Thermal Printer
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  print_bluetooth_thermal: ^1.1.5
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  intl: ^0.19.0
  provider: ^6.1.2
  path_provider: ^2.1.3
  image: ^4.2.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.5
  http: ^1.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/ICO.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ICO.png"
  min_sdk_android: 21